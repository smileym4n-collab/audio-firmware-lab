[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  pschatzmann/arduino-audio-tools @ ^1.1.1
  pschatzmann/arduino-snapclient @ ^0.1.0
  pschatzmann/arduino-libopus @ ^1.0.3

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_SNAPCLIENT_USE_MDNS=false
  -DCONFIG_NVS_FLASH=false
