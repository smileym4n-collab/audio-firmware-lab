; NJW1195A bench test firmware for ESP32-S3 DevKitC-1
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; CH343 USB-serial on this board gives packet errors at 460800 and above
upload_speed = 230400
monitor_filters = send_on_enter
monitor_echo = yes

build_flags =
  ; Serial on the "UART"/"COM" port (CH343 USB-serial chip, UART0).
  ; Set to 1 to use the native USB port (USB-CDC) instead.
  -DARDUINO_USB_CDC_ON_BOOT=0
